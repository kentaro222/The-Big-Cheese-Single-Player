#clock-display {
    position: absolute;

    top: 6px;
    right: 12px;

    font-size: clamp(28px, 5vw, 56px);
    font-weight: bold;
    color: #fff;

    text-shadow:
        0 0 15px #ff00ff,
        0 0 30px #00ffff;

    pointer-events: none;
    letter-spacing: 4px;

    z-index: 100;

    text-align: right;
    white-space: nowrap;
}
